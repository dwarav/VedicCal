{% extends "base.html" %}

{% block title %}Vedic Panchang{% endblock %}

{% block head %}
<style>
    /* Custom styles for the search card in index.html */
    .search-card {
        max-width: 500px;
        margin: 40px auto;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(50, 20, 0, 0.1);
        background: white;
        position: relative;
        border-top: 5px solid #ff6f00;
    }

    .btn-vedic {
        background: linear-gradient(45deg, #ff6f00, #ff8f00);
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-vedic:hover {
        background: linear-gradient(45deg, #e65100, #f57c00);
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 111, 0, 0.3);
    }

    h2 {
        font-family: 'Playfair Display', serif;
        color: #4a148c;
        font-weight: 700;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="search-card text-center">
        <h2 class="mb-4">🕉️ Vedic Panchang</h2>

        {% if error %}
        <div class="alert alert-danger shadow-sm border-0">{{ error }}</div>
        {% endif %}

        <form method="POST" autocomplete="off">
            <div class="mb-4 text-start position-relative">
                <label class="form-label">Location</label>
                <input type="text" id="locationInput" name="location" class="form-control"
                    placeholder="Start typing city name..." required>
                <ul id="suggestions" class="suggestions-list"></ul>
            </div>

            <div class="mb-5 text-start">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-control" value="{{ today }}" required>
            </div>
            <button type="submit" class="btn btn-vedic w-100 py-3">View Panchang</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const input = document.getElementById('locationInput');
    const list = document.getElementById('suggestions');
    let debounceTimer;

    input.addEventListener('input', function () {
        const query = this.value;
        clearTimeout(debounceTimer);

        if (query.length < 3) {
            list.style.display = 'none';
            return;
        }

        debounceTimer = setTimeout(() => {
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=10&addressdetails=1`)
                .then(response => response.json())
                .then(data => {
                    list.innerHTML = '';
                    const uniqueSet = new Set();

                    if (data.length > 0) {
                        let hasResults = false;

                        data.forEach(item => {
                            const addr = item.address;
                            const city = addr.city || addr.town || addr.village || addr.municipality || addr.hamlet || addr.county;
                            const country = addr.country;

                            if (city && country) {
                                const cleanName = `${city}, ${country}`;

                                if (!uniqueSet.has(cleanName)) {
                                    uniqueSet.add(cleanName);
                                    hasResults = true;

                                    const li = document.createElement('li');
                                    li.textContent = cleanName;

                                    li.addEventListener('click', () => {
                                        input.value = cleanName;
                                        list.style.display = 'none';
                                    });

                                    list.appendChild(li);
                                }
                            }
                        });

                        list.style.display = hasResults ? 'block' : 'none';
                    } else {
                        list.style.display = 'none';
                    }
                })
                .catch(err => console.error(err));
        }, 300);
    });

    document.addEventListener('click', function (e) {
        if (e.target !== input && e.target !== list) {
            list.style.display = 'none';
        }
    });
</script>
{% endblock %}
